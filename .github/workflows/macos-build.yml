name: macOS personal build

on:
  workflow_dispatch:
  push:
    branches: [main, 'upgrade/**', 'ci/cloud-baseline']
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_BUILD_CONFIGURATION: ${{ github.ref == 'refs/heads/ci/cloud-baseline' && 'Debug' || 'Release' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify toolchain and prepare pinned Whisper
        run: bash scripts/ci/prepare.sh
      - name: Compute toolchain and lockfile cache keys
        id: cache-keys
        run: python3 scripts/ci/cache-key.py
      - name: Restore locked Swift packages
        id: spm-cache
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-build/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm-key }}
          restore-keys: ${{ steps.cache-keys.outputs.spm-prefix }}
      - name: Restore matching compiler intermediates
        id: compile-cache
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .ci-build/Build/Intermediates.noindex
            .ci-build/Build/Products
            .ci-build/ModuleCache.noindex
          key: ${{ steps.cache-keys.outputs.compile-key }}
          restore-keys: ${{ steps.cache-keys.outputs.compile-prefix }}
      - name: Record cache evidence
        env:
          SPM_HIT: ${{ steps.spm-cache.outputs.cache-hit }}
          SPM_MATCH: ${{ steps.spm-cache.outputs.cache-matched-key }}
          COMPILE_HIT: ${{ steps.compile-cache.outputs.cache-hit }}
          COMPILE_MATCH: ${{ steps.compile-cache.outputs.cache-matched-key }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result={k:os.getenv(k,'') for k in ['SPM_HIT','SPM_MATCH','COMPILE_HIT','COMPILE_MATCH']}
          result['state']='warm-restored' if result['COMPILE_MATCH'] else 'cold'
          Path('artifacts/cache-status.json').write_text(json.dumps(result,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Cache: '+json.dumps(result)+'\n\n')
          PY
      - name: Compile production app (${{ env.CI_BUILD_CONFIGURATION }})
        env:
          CI_COMPILE_CACHE_MATCH: ${{ steps.compile-cache.outputs.cache-matched-key }}
          CI_SPM_CACHE_MATCH: ${{ steps.spm-cache.outputs.cache-matched-key }}
        run: bash scripts/ci/build.sh build
      - name: Save compiler intermediates (trusted pushes only)
        if: >-
          github.repository == 'AaronJny/VoiceInk' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upgrade/') || github.ref == 'refs/heads/ci/cloud-baseline') &&
          steps.compile-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .ci-build/Build/Intermediates.noindex
            .ci-build/Build/Products
            .ci-build/ModuleCache.noindex
          key: ${{ steps.cache-keys.outputs.compile-key }}
      - name: Run ten regression suites
        env:
          CI_COMPILE_CACHE_MATCH: ${{ steps.compile-cache.outputs.cache-matched-key }}
          CI_SPM_CACHE_MATCH: ${{ steps.spm-cache.outputs.cache-matched-key }}
        run: bash scripts/ci/build.sh test
      - name: Save locked Swift packages (trusted pushes only)
        if: >-
          github.repository == 'AaronJny/VoiceInk' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upgrade/') || github.ref == 'refs/heads/ci/cloud-baseline') &&
          steps.spm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-build/SourcePackages
          key: ${{ steps.cache-keys.outputs.spm-key }}
      - name: Package tested clean application (UNSIGNED intermediate)
        if: >-
          github.repository == 'AaronJny/VoiceInk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upgrade/') || github.ref == 'refs/heads/ci/cloud-baseline')
        run: bash scripts/ci/package-intermediate.sh
      - name: Upload UNSIGNED build intermediate
        if: >-
          github.repository == 'AaronJny/VoiceInk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upgrade/') || github.ref == 'refs/heads/ci/cloud-baseline')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-intermediate-${{ github.sha }}
          overwrite: true
          path: artifacts/intermediate/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ github.sha }}
          overwrite: true
          path: |
            artifacts/*.txt
            artifacts/*.json
            artifacts/*.log
            artifacts/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  sign:
    outputs:
      signed-artifact-id: ${{ steps.signed-artifact.outputs.artifact-id }}
    needs: build
    if: >-
      github.repository == 'AaronJny/VoiceInk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upgrade/') || github.ref == 'refs/heads/ci/cloud-baseline')
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download same-run UNSIGNED intermediate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-intermediate-${{ github.sha }}
          path: artifacts/intermediate
      - name: Verify source, digest and restore clean app
        run: bash scripts/ci/restore-intermediate.sh
      - name: Sign and verify personal artifact
        id: signing
        if: >-
          github.repository == 'AaronJny/VoiceInk' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upgrade/') || github.ref == 'refs/heads/ci/cloud-baseline')
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY_SHA1: ${{ vars.SIGNING_IDENTITY_SHA1 }}
        run: bash scripts/ci/sign.sh
      - name: Upload signed application
        id: signed-artifact
        if: success() && steps.signing.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoiceInk-arm64-${{ github.sha }}
          overwrite: true
          path: |
            artifacts/VoiceInk-*.zip
            artifacts/build-info.json
            artifacts/test-summary.json
            artifacts/toolchain.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/ci/cleanup-signing.py
      - name: Upload signing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/*.txt
            artifacts/*.json
            artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7

  dmg:
    needs: sign
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download same-run signed application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: VoiceInk-arm64-${{ github.sha }}
          path: signed-input
      - name: Build and mount-verify installable DMG
        env:
          SOURCE_ARTIFACT_ID: ${{ needs.sign.outputs.signed-artifact-id }}
        run: python3 scripts/ci/package-dmg.py
      - name: Upload verified DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VoiceInk-DMG-${{ github.sha }}
          path: dmg-output/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
