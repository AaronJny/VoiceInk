name: Package verified v2.27 build
on:
  push:
    branches: ['ci/package-v2.27']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.repository == 'AaronJny/VoiceInk' && github.ref == 'refs/heads/ci/package-v2.27'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sign-tools
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 17556da29702ad834ca602c959fdd4b1078bddc4
          path: source
          persist-credentials: false
      - name: Prepare current signer for the verified source
        run: cp sign-tools/scripts/ci/{sign.sh,sign_bundle.py,cleanup-signing.py} source/scripts/ci/
      - name: Download the already-tested immutable build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-intermediate-17556da29702ad834ca602c959fdd4b1078bddc4
          path: source/artifacts/intermediate
          run-id: 43244065239
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify original commit, build run, hashes and tests
        working-directory: source
        run: GITHUB_SHA=17556da29702ad834ca602c959fdd4b1078bddc4 GITHUB_RUN_ID=43244065239 bash ../sign-tools/scripts/ci/restore-intermediate.sh
      - name: Sign full application with the original certificate
        working-directory: source
        env:
          VOICEINK_PACKAGING_COMMIT: ${{ github.sha }}
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY_SHA1: ${{ vars.SIGNING_IDENTITY_SHA1 }}
        run: GITHUB_SHA=17556da29702ad834ca602c959fdd4b1078bddc4 bash scripts/ci/sign.sh
      - name: Upload verified signed application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VoiceInk-v2.27-arm64-17556da
          path: |
            source/artifacts/VoiceInk-*.zip
            source/artifacts/build-info.json
            source/artifacts/toolchain.txt
            source/artifacts/test-summary.json
            source/artifacts/signing-cleanup.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Erase temporary private signing material
        if: always()
        working-directory: source
        run: python3 scripts/ci/cleanup-signing.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: source/artifacts/*.json
          retention-days: 7
